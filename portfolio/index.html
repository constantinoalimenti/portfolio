
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portfolio</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

    <header>
        <h1>Mi Portfolio</h1>
        <button id="btn-tema">Cambiar tema</button>
    </header>

    <section>
        <h2>Hola, soy Constantino</h2>
        <p>Estudio sexto año de Programacion.</p>
    </section>

    <section>
        <h2>Sobre mi</h2>
        <p>
            Me gusta la tecnologia y la programacion.
            Estoy aprendiendo a desarrollar paginas web
            y crear diferentes proyectos.
        </p>
    </section>

    <section>
        <h2>Mis proyectos</h2>
        <p id="estado-proyectos">Cargando proyectos...</p>
        <div id="lista-proyectos"></div>
    </section>

    <section>
        <h2>Contacto</h2>

        <form id="form-contacto" novalidate>

            <label>Nombre:</label>
            <input type="text" id="nombre">
            <span id="error-nombre" class="error"></span>

            <label>Email:</label>
            <input type="email" id="email">
            <span id="error-email" class="error"></span>

            <label>Mensaje:</label>
            <textarea id="mensaje"></textarea>
            <span id="error-mensaje" class="error"></span>

            <p id="contador-mensaje">0 caracteres</p>

            <button type="submit">Enviar</button>

            <p id="resultado-form"></p>

        </form>
    </section>

    <footer>
        <p>Mi Portfolio - 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
